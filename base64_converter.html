<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 File Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4 font-sans">

    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-3xl font-extrabold text-center text-gray-800">File ↔ Base64 Converter</h1>

        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-blue-600 px-6 py-4">
                <h2 class="text-lg font-semibold text-white">Encoder: File to Base64</h2>
            </div>
            <div class="p-6">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Upload Image or PDF</label>
                    <input type="file" id="encoderInput" accept="image/*,application/pdf" 
                        class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-dashed border-gray-300 rounded-lg p-4 bg-gray-50" />
                </div>

                <div id="encoderResult" class="hidden space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <p class="text-xs font-bold uppercase text-gray-400 mb-2">Original Preview</p>
                            <div id="encoderPreviewContainer" class="h-64 border rounded-lg bg-gray-50 flex items-center justify-center overflow-hidden">
                                </div>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <p class="text-xs font-bold uppercase text-gray-400">Base64 String</p>
                                <button onclick="copyToClipboard('encoderTextarea')" class="text-xs font-medium text-blue-600 hover:underline">Copy All</button>
                            </div>
                            <textarea id="encoderTextarea" readonly class="w-full h-56 p-3 text-[10px] font-mono bg-gray-900 text-green-400 rounded-lg border-none focus:ring-0"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-emerald-600 px-6 py-4">
                <h2 class="text-lg font-semibold text-white">Decoder: Base64 to File</h2>
            </div>
            <div class="p-6">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Paste Base64 String (starting with data:...)</label>
                    <textarea id="decoderInput" placeholder="data:image/png;base64,..." 
                        class="w-full h-32 p-3 text-xs font-mono border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                    <button id="decodeBtn" class="mt-3 w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold hover:bg-emerald-700 transition">Process & Preview</button>
                </div>

                <div id="decoderResult" class="hidden">
                    <p class="text-xs font-bold uppercase text-gray-400 mb-2">Decoded Result</p>
                    <div id="decoderPreviewContainer" class="min-h-[300px] border-2 border-dashed rounded-lg bg-gray-50 flex flex-col items-center justify-center p-4">
                        </div>
                    <div class="mt-4 flex justify-center">
                        <button id="downloadBtn" class="bg-gray-800 text-white px-6 py-2 rounded-lg text-sm hover:bg-gray-900">Download File</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        /** ENCODER LOGIC **/
        const encoderInput = document.getElementById('encoderInput');
        const encoderResult = document.getElementById('encoderResult');
        const encoderPreview = document.getElementById('encoderPreviewContainer');
        const encoderTextarea = document.getElementById('encoderTextarea');

        encoderInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64 = event.target.result;
                encoderTextarea.value = base64;
                encoderResult.classList.remove('hidden');

                // Render preview based on type
                if (file.type.startsWith('image/')) {
                    encoderPreview.innerHTML = `<img src="${base64}" class="max-h-full object-contain shadow-sm">`;
                } else if (file.type === 'application/pdf') {
                    encoderPreview.innerHTML = `<embed src="${base64}" type="application/pdf" width="100%" height="100%">`;
                }
            };
            reader.readAsDataURL(file);
        });

        /** DECODER LOGIC **/
        const decoderInput = document.getElementById('decoderInput');
        const decodeBtn = document.getElementById('decodeBtn');
        const decoderResult = document.getElementById('decoderResult');
        const decoderPreview = document.getElementById('decoderPreviewContainer');
        const downloadBtn = document.getElementById('downloadBtn');

        decodeBtn.addEventListener('click', () => {
            const base64String = decoderInput.value.trim();
            if (!base64String) return alert("Please paste a Base64 string first.");

            decoderResult.classList.remove('hidden');
            
            // Detect if PDF or Image
            if (base64String.includes('application/pdf')) {
                decoderPreview.innerHTML = `<iframe src="${base64String}" class="w-full h-[400px]" frameborder="0"></iframe>`;
            } else if (base64String.includes('image/')) {
                decoderPreview.innerHTML = `<img src="${base64String}" class="max-h-[400px] object-contain">`;
            } else {
                decoderPreview.innerHTML = `<div class="text-red-500 text-sm">Unknown file format. Ensure string starts with "data:..."</div>`;
            }

            // Setup download
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.href = base64String;
                link.download = "decoded-file-" + Date.now();
                link.click();
            };
        });

        /** UTILITY **/
        function copyToClipboard(elementId) {
            const el = document.getElementById(elementId);
            el.select();
            navigator.clipboard.writeText(el.value);
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
